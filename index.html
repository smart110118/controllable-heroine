<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controllable Heroine</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div class="hud">
        <h1>Controllable Heroine</h1>
        <p class="hint">window.hero.act('sneeze' | 'peace' | 'wave' | 'idle')</p>
        <div class="actions">
          <button type="button" data-act="idle">Idle</button>
          <button type="button" data-act="wave">Wave</button>
          <button type="button" data-act="peace">Peace</button>
          <button type="button" data-act="sneeze">Sneeze ≈</button>
        </div>
        <p id="status">Loading avatar…</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
